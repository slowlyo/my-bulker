name: Release

on:
  push:
    tags:
      - 'v*' # 触发标签, 如 v1.0.0
  workflow_dispatch: # 允许手动触发

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  WAILS_VERSION: v2.12.0

jobs:
  lint-workflow:
    name: Lint workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Static-check release.yml
        run: ./scripts/check-release-workflow.sh

  build:
    name: Build
    needs: lint-workflow
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve app version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "APP_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=snapshot-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        run: cd ui && pnpm install

      - name: Build frontend
        run: cd ui && APP_VERSION="${{ env.APP_VERSION }}" pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up build environment
        run: |
          echo "BINARY_NAME=my-bulker" >> $GITHUB_ENV
          if [ "${{ matrix.goos }}" = "windows" ]; then
            echo "ARCHIVE_NAME=my-bulker-${{ matrix.goos }}-${{ matrix.goarch }}.zip" >> $GITHUB_ENV
            echo "BINARY_EXT=.exe" >> $GITHUB_ENV
          else
            echo "ARCHIVE_NAME=my-bulker-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" >> $GITHUB_ENV
            echo "BINARY_EXT=" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build Go application
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -ldflags="-s -w -X my-bulker/internal/pkg/appmeta.Version=${{ env.APP_VERSION }}" -o "release/${{ env.BINARY_NAME }}${{ env.BINARY_EXT }}" .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Package release assets
        run: |
          mkdir -p release_package
          cp README.md release_package/
          mv release/${{ env.BINARY_NAME }}${{ env.BINARY_EXT }} release_package/
          cd release_package
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r ../${{ env.ARCHIVE_NAME }} .
          else
            tar -czf ../${{ env.ARCHIVE_NAME }} .
          fi
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE_NAME }}

  build-desktop:
    name: Build Desktop (${{ matrix.name }})
    needs: lint-workflow
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            wails_platform: windows/amd64
            package_platform: windows
            package_arch: amd64
          - name: darwin-universal
            os: macos-latest
            wails_platform: darwin/universal
            package_platform: darwin
            package_arch: universal
          - name: linux-amd64
            os: ubuntu-latest
            wails_platform: linux/amd64
            package_platform: linux
            package_arch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve app version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=snapshot-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Install frontend dependencies
        run: cd ui && pnpm install

      - name: Build frontend
        run: cd ui && APP_VERSION="${APP_VERSION}" pnpm build

      - name: Inject desktop product version
        run: python3 ./scripts/inject-desktop-version.py

      - name: Build desktop app
        env:
          SKIP_UI: "1"
        run: ./scripts/build-desktop.sh -m -platform "${{ matrix.wails_platform }}"

      - name: Package desktop artifact
        run: python3 ./scripts/package-desktop.py "${{ matrix.package_platform }}" "${{ matrix.package_arch }}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: release-desktop/my-bulker-desktop-*
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    # 服务端矩阵成功即可发版；某个桌面平台失败时仍上传已成功的产物。
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List downloaded files
        run: find release-assets -type f -name '*.*'

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
          generate_release_notes: true
          fail_on_unmatched_files: true
